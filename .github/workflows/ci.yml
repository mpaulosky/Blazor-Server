# yamllint disable rule:line-length
---
name: Build and Test Suite

# NOTE: All test projects now use 'dotnet test' consistently.
# This was updated to fix issues with direct executable execution that were
# causing "No such file or directory" errors in CI.

# Read-only by default: build and test jobs run pull-request code. Only the
# report job, which runs no PR code, gets write access.
permissions:
  contents: read

"on":
  workflow_call:
    inputs:
      project_name:
        description: "Solution name without .slnx"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

  # No paths-ignore here: the "Build Solution" job below is a required
  # status check on main's ruleset. A docs-only PR that this workflow
  # never runs against would leave that check permanently missing,
  # blocking the PR from merging forever (see PR #26).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      project_name:
        description: "Solution name without .slnx"
        required: false
        default: ""
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual test run"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_NAME: ${{ inputs.project_name || github.event.repository.name }}.slnx
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # Aspire parameter bindings for E2E.Tests
  # (Parameters: auth0MgmtClientId/Secret)
  # Every secret below is withheld from runs of a dependabot/* branch, however
  # they were triggered (the PR's head branch, or the ref of a manual run): a
  # maintainer re-running, reopening, updating or dispatching one would
  # otherwise hand the real Auth0 credentials to unreviewed dependency code
  # (restore, build and every test job can read this env).
  Auth0__Domain: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_DOMAIN || '' }}
  Auth0__ClientId: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_CLIENT_ID || '' }}
  Auth0__ClientSecret: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_CLIENT_SECRET || '' }}
  Auth0Management__ClientId: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_MANAGEMENT_CLIENT_ID || '' }}
  Auth0Management__ClientSecret: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_MANAGEMENT_CLIENT_SECRET || '' }}
  Auth0Management__Domain: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_DOMAIN || '' }}
  Auth0Management__Audience: https://${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_DOMAIN || '' }}/api/v2/
  Parameters__auth0MgmtClientId: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_MANAGEMENT_CLIENT_ID || '' }}
  Parameters__auth0MgmtClientSecret: >-
    ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_MANAGEMENT_CLIENT_SECRET || '' }}

  # Role test-user credentials for UI.Tests.E2E's authenticated Playwright fixtures
  Auth0__E2E__Admin__Username: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_ADMIN_USERNAME || '' }}
  Auth0__E2E__Admin__Password: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_ADMIN_PASSWORD || '' }}
  Auth0__E2E__User__Username: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_USER_USERNAME || '' }}
  Auth0__E2E__User__Password: ${{ !startsWith(github.head_ref || github.ref_name, 'dependabot/') && secrets.AUTH0_USER_PASSWORD || '' }}

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{
            hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Discover solution file
        run: |
          mapfile -t matches < <(find . -maxdepth 1 -name '*.slnx')
          count=${#matches[@]}
          if [[ $count -eq 0 ]]; then
            echo "::error::No *.slnx file found at the repository root."
            exit 1
          elif [[ $count -gt 1 ]]; then
            echo "::error::Multiple *.slnx files found"
            echo "::error::${matches[*]}"
            exit 1
          fi
          echo "SOLUTION_FILE=${matches[0]}" >> "$GITHUB_ENV"
          echo "Discovered solution: ${matches[0]}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: >-
          dotnet build "$SOLUTION_FILE" --configuration Release
          --no-restore

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            **/bin/Release/
            **/obj/
          key: >-
            ${{ runner.os }}-build-${{ hashFiles('**/*.csproj',
            '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

  # Unit tests for .github/scripts (the release blog generator).
  # Deliberately not a required status check on main's ruleset.
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        run: python -m pytest .github/scripts/tests

      - name: Run PR automerge Node tests
        run: node --test .github/scripts/tests/pr-automerge.test.mjs

  # The pre-push hook and scripts/gate.sh have their own tests, which stub
  # every tool they call, so they need nothing installed.
  hook-tests:
    name: Hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run pre-push hook tests
        run: bash .github/hooks/tests/pre-push.test.sh

      - name: Run gate tests
        run: bash scripts/tests/gate.test.sh

  # Dependabot PRs run the test suite too: a dependency bump is exactly the
  # change the tests must vet. The one exception is the Playwright (E2E)
  # projects, which log in to Auth0 with real credentials. dependabot/*
  # branches get no secrets (see env above), so discovery leaves those projects
  # out there, and they run on main once the bump merges. No other test reads
  # a secret.
  discover-tests:
    name: Discover Test Projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_tests: ${{ steps.discover.outputs.has_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Discover test projects
        id: discover
        env:
          # The branch, not the actor: see the env comment at the top.
          DEPENDABOT: ${{ startsWith(github.head_ref || github.ref_name, 'dependabot/') }}
        run: |
          matrix_json=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          projects = []
          for csproj in sorted(Path("tests").glob("**/*.csproj")):
              folder = csproj.parent.name
              lowered = folder.lower()
              test_id = lowered.replace(".", "-").replace("_", "-")
              is_e2e = "e2e" in lowered
              csproj_text = csproj.read_text()
              uses_playwright = "Microsoft.Playwright" in csproj_text
              if uses_playwright and os.environ.get("DEPENDABOT") == "true":
                  # Credentialed E2E: never on an unreviewed Dependabot bump.
                  continue
              # Playwright projects must be built before browsers can be installed.
              prebuild = is_e2e or uses_playwright
              projects.append(
                  {
                      "project_path": csproj.as_posix(),
                      "test_name": folder,
                      "test_id": test_id,
                      "build_before_test": prebuild,
                      "no_build": prebuild,
                      "requires_playwright": uses_playwright,
                      "verbosity": "normal" if is_e2e else "minimal",
                  }
              )

          print(json.dumps({"include": projects}))
          PY
          )

          {
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          project_count=$(echo "$matrix_json" | jq '.include | length')
          if [ "$project_count" -eq 0 ]; then
            # Expected while the repo is being bootstrapped: skip the test
            # matrix instead of failing CI.
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No test projects found under tests/ — skipping tests."
          else
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discovered ${project_count} test projects under tests/"
          fi

  test:
    if: ${{ needs.discover-tests.outputs.has_tests == 'true' }}
    name: "Tests: ${{ matrix.test_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - build
      - discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    env:
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
      # Enable Playwright trace/video/screenshot capture for E2E jobs
      PLAYWRIGHT_ARTIFACTS: >-
        ${{ matrix.requires_playwright && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{
            hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      # Matrix values come from the PR's test project paths: pass them through
      # the environment rather than interpolating them into scripts.
      - name: Build test project
        if: ${{ matrix.build_before_test }}
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        run: >-
          dotnet build "$PROJECT_PATH" --configuration Release
          --no-restore

      - name: Install Playwright browsers
        if: ${{ matrix.requires_playwright }}
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        run: |
          project_dir="$(dirname "$PROJECT_PATH")"
          playwright_script=$(find "$project_dir/bin/Release" \
            -type f -name "playwright.ps1" | head -n 1)
          if [ -z "$playwright_script" ]; then
            echo "::error::Unable to locate playwright.ps1 for $PROJECT_PATH"
            exit 1
          fi
          pwsh "$playwright_script" install chromium --with-deps

      - name: Run tests
        id: run-tests
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
          TEST_ID: ${{ matrix.test_id }}
          VERBOSITY: ${{ matrix.verbosity }}
          NO_BUILD: ${{ matrix.no_build }}
        run: |
          mkdir -p test-results

          no_build_arg=()
          if [ "$NO_BUILD" = "true" ]; then
            no_build_arg=(--no-build)
          fi

          # Microsoft Testing Platform is enabled via global.json for .NET 10, so
          # the coverage and xUnit report args are passed directly to the MTP runner
          # instead of the legacy VSTest collector/Logger syntax.
          # .NET 10 uses Microsoft Testing Platform (MTP), which accepts the
          # xUnit TRX report option but not the legacy VSTest coverage flags.
          dotnet test "$PROJECT_PATH" \
            --configuration Release \
            "${no_build_arg[@]}" \
            --verbosity "$VERBOSITY" \
            --results-directory "$GITHUB_WORKSPACE/test-results" \
            --report-xunit-trx \
            --report-xunit-trx-filename "${TEST_ID}.trx" \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output "${TEST_ID}.cobertura.xml"
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "::error::Test project failed: $PROJECT_PATH"
          fi
          exit $exit_code

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: test-results-${{ matrix.test_id }}
          path: test-results

      - name: Resolve test project directory
        id: project-dir
        if: ${{ always() && matrix.requires_playwright }}
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        run: echo "dir=$(dirname "$PROJECT_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: ${{ always() && matrix.requires_playwright }}
        with:
          name: playwright-artifacts-${{ matrix.test_id }}
          path: ${{ steps.project-dir.outputs.dir }}/bin/Release/**/TestResults/playwright-artifacts/
          if-no-files-found: ignore

  coverage:
    if: >-
      ${{ always() && needs.discover-tests.outputs.has_tests == 'true' }}
    name: Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - discover-tests
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: global.json

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: coverage-reports

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"coverage-reports/**/*.cobertura.xml" \
            -targetdir:"./coverage-output" \
            -reporttypes:"Html;Cobertura;JsonSummary" \
            -filefilters:"-**/obj/**/*.cs;-**/*.generated.cs" \
            -verbosity:verbose || echo "::warning::No coverage files found"

      - name: Check coverage threshold
        run: |
          summary_json="./coverage-output/Summary.json"
          if [ -f "./coverage-output/Summary.json" ]; then
            echo "=== Summary.json raw ==="
            cat "$summary_json" | jq . || true
            coverable_expr='.summary.coverablelines // '
            coverable_expr+='.summary.coverableLines // '
            coverable_expr+='.coverablelines // .coverableLines // 0'
            coverable_lines=$(jq -r "$coverable_expr" \
              "$summary_json" 2>/dev/null || echo "0")
            coverage_expr='.summary.linecoverage // .lineCoverage // 0'
            coverage=$(jq -r "$coverage_expr" \
              "$summary_json" 2>/dev/null || echo "0")
            echo "Line Coverage: $coverage%"
            if [ "$coverable_lines" = "0" ]; then
              echo "::warning::No coverable lines found in Summary.json"
              echo "::warning::Skipping threshold check"
            else
              if (( $(echo "$coverage < 80" | bc -l) )); then
                echo "::warning::Code coverage is below 80% threshold"
                echo "::warning::$coverage% (required: 80%)"
                echo "::warning::Continuing without failing the workflow"
              else
                echo "::notice::Coverage gate passed: $coverage% >= 80%"
              fi
            fi
          else
            echo "::warning::Coverage report not available"
            echo "::warning::Skipping threshold check"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-reports
          path: coverage-output

      - name: Publish to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        if: always()
        with:
          files: ./coverage-output/Cobertura.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true

  report:
    if: ${{ always() }}
    name: Test Report Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # publish-unit-test-result-action writes a check run and a PR comment.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: read
    needs:
      - build
      - discover-tests
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Download all test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: all-test-results

      # Dependabot runs get a read-only token whatever the job asks for, so the
      # check run and PR comment this writes can't be published there. The
      # status step below still fails the job when a test did.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: >-
          ${{ always() && needs.discover-tests.outputs.has_tests == 'true' &&
          github.actor != 'dependabot[bot]' }}
        with:
          files: |
            all-test-results/**/*.trx
            all-test-results/**/*-nunit.xml
          check_name: Test Results Summary
          compare_to_earlier_commit: true

      - name: Generate job summary
        if: always()
        env:
          # PR-controlled project paths: read from the environment, not
          # interpolated into the script.
          TEST_MATRIX: ${{ needs.discover-tests.outputs.matrix }}
          BUILD_STATUS: ${{ needs.build.result }}
          DISCOVER_STATUS: ${{ needs.discover-tests.result }}
          TEST_STATUS: ${{ needs.test.result }}
        run: |
          {
            echo "## Test Execution Summary"
            echo ""
            echo "### Job Status"
            echo "- **Build:** ${BUILD_STATUS}"
            echo "- **Discovered Tests:** ${DISCOVER_STATUS}"
            echo "- **Test Matrix:** ${TEST_STATUS}"
            echo ""
            echo "### Artifacts"
            echo "- Test and coverage reports are in Actions artifacts"
            echo "- Coverage report: \`coverage-reports\`"
            echo ""
            echo "### Discovered Test Projects"
            printf '%s' "$TEST_MATRIX" \
              | jq -r '(.include // [])[].project_path | "- " + .'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # This job is the required status check that stands in for the
          # dynamically named "Tests: …" matrix jobs, so it must fail when
          # they do. A skipped test matrix (no test projects) still passes.
          if [[ "$BUILD_STATUS" =~ ^(failure|cancelled)$ \
            || "$DISCOVER_STATUS" =~ ^(failure|cancelled)$ \
            || "$TEST_STATUS" =~ ^(failure|cancelled)$ ]]; then
            echo "❌ **Overall Status:** FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ **Overall Status:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          fi
