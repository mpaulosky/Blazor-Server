---
name: Lint Markdown
# Runs markdownlint-cli2 with the rules and ignores in .markdownlint-cli2.jsonc,
# the same config the pre-commit and pre-push hooks use

"on":
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  # .github/copilot-instructions.md is generated from the code-review skill,
  # so GitHub's Copilot review and Claude Code review against the same rules.
  copilot-review-sync:
    name: Copilot review instructions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check copilot-instructions.md matches the code-review skill
        run: scripts/sync-copilot-review.sh --check
