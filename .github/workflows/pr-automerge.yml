---
name: PR Auto-Merge

# Squash-merges a same-repo PR into main once it is ready: required checks
# pass, Copilot has reviewed the current head commit, and every review
# thread is resolved. The main ruleset asks Copilot to review each push but
# doesn't require its review, so merging on green alone would usually land a
# PR before that review arrives. Each trigger below is a moment one of those
# conditions can become true; the job re-checks all of them every time.
"on":
  pull_request:
    types: [opened, ready_for_review, reopened, edited, synchronize]
    branches: [main]
  pull_request_review:
    types: [submitted]
  pull_request_review_thread:
    types: [resolved]
  # GitHub sends no check_suite events for suites created by Actions, and
  # every required check comes from one of these workflows, so their
  # completion is the signal that the checks may have gone green.
  workflow_run:
    workflows: ["Build and Test Suite", "Lint Markdown", "Lint YAML", "CodeQL"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-when-ready:
    name: Merge same-repo PRs when ready
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge when ready
        uses: actions/github-script@v9
        env:
          HAS_RELEASE_PR_PAT: ${{ secrets.RELEASE_PR_PAT != '' }}
        with:
          # A merge made with GITHUB_TOKEN starts no workflows, so release.yml
          # (on: pull_request closed) would never run for it. Merge with the
          # PAT when it's set, the same fallback the release workflow uses.
          github-token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            // pull_request, pull_request_review and pull_request_review_thread
            // events all carry the PR; workflow_run carries only a commit.
            const pullRequestPayload = context.payload.pull_request;
            const workflowRun = context.payload.workflow_run;

            let pullNumber = pullRequestPayload?.number;
            if (!pullNumber && workflowRun) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: workflowRun.head_sha
              });

              const matching = associated.data.find((pr) => {
                return (
                  pr.state === "open" &&
                  !pr.draft &&
                  pr.head?.sha === workflowRun.head_sha &&
                  pr.head?.repo?.full_name === `${owner}/${repo}`
                );
              });

              if (!matching) {
                core.info(`Skipping ${workflowRun.head_sha}: no open same-repo PR has it as its head.`);
                return;
              }

              pullNumber = matching.number;
            }

            if (!pullNumber) {
              core.info("No pull request number was resolved for this event.");
              return;
            }

            const pull = pullRequestPayload ??
              await github.rest.pulls.get({ owner, repo, pull_number: pullNumber }).then((result) => result.data);

            if (pull.merged_at || pull.state !== "open") {
              core.info(
                `Skipping PR #${pullNumber}: ` +
                `state=${pull.state}, merged_at=${pull.merged_at ?? "null"}.`
              );
              return;
            }

            if (pull.draft || pull.head?.repo?.full_name !== `${owner}/${repo}`) {
              core.info(
                `Skipping PR #${pullNumber}: draft or not a same-repo branch.`
              );
              return;
            }

            if (pull.base?.ref !== "main") {
              core.info(`Skipping PR #${pullNumber}: base is ${pull.base?.ref}, not main.`);
              return;
            }

            const status = await github.graphql(
              `query MergeReadiness(
                 $owner: String!,
                 $repo: String!,
                 $number: Int!
               ) {
                 repository(owner: $owner, name: $repo) {
                   pullRequest(number: $number) {
                     state
                     merged
                     isDraft
                     headRefOid
                     mergeable
                     mergeStateStatus
                     autoMergeRequest {
                       enabledAt
                     }
                     reviews(last: 50) {
                       nodes {
                         author { login }
                         commit { oid }
                       }
                     }
                     reviewThreads(first: 100) {
                       nodes { isResolved }
                     }
                   }
                 }
               }`,
              { owner, repo, number: pullNumber }
            );

            const currentPr = status.repository.pullRequest;
            if (!currentPr || currentPr.state !== "OPEN" || currentPr.merged || currentPr.isDraft) {
              core.info(`Skipping PR #${pullNumber}: closed, merged, or draft.`);
              return;
            }

            // release.yml and backfill-blog-posts.yml turn on auto-merge for
            // their own docs PRs; GitHub finishes those, so leave them alone.
            if (currentPr.autoMergeRequest) {
              core.info(`Skipping PR #${pullNumber}: auto-merge is already enabled.`);
              return;
            }

            const headSha = currentPr.headRefOid;
            const copilotReviewed = currentPr.reviews.nodes.some((review) => {
              return (
                review.author?.login === "copilot-pull-request-reviewer" &&
                review.commit?.oid === headSha
              );
            });
            if (!copilotReviewed) {
              core.info(`Waiting on PR #${pullNumber}: no Copilot review of ${headSha} yet.`);
              return;
            }

            const unresolved = currentPr.reviewThreads.nodes.filter((thread) => !thread.isResolved).length;
            if (unresolved > 0) {
              core.info(`Waiting on PR #${pullNumber}: ${unresolved} unresolved review thread(s).`);
              return;
            }

            // CLEAN means required checks passed and the branch is up to date
            // with main. Anything else (pending or failing checks, BEHIND,
            // conflicts, or UNKNOWN while GitHub computes it) waits for a
            // later event.
            if (currentPr.mergeable !== "MERGEABLE" || currentPr.mergeStateStatus !== "CLEAN") {
              core.info(
                `Waiting on PR #${pullNumber}: mergeable=${String(currentPr.mergeable)} ` +
                `mergeStateStatus=${currentPr.mergeStateStatus ?? "unknown"}.`
              );
              return;
            }

            if (process.env.HAS_RELEASE_PR_PAT !== "true") {
              core.warning(
                "RELEASE_PR_PAT is not set, so this merge uses GITHUB_TOKEN and release.yml will not run for it."
              );
            }

            try {
              // sha pins the merge to the commit that was checked above, so a
              // push that lands in between makes the merge fail instead of
              // merging unreviewed code.
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullNumber,
                sha: headSha,
                merge_method: "squash"
              });
            } catch (error) {
              // 405: not mergeable after all (e.g. a parallel run just merged
              // it); 409: the head moved. A later event re-evaluates the PR.
              if (error.status === 405 || error.status === 409) {
                core.warning(`Not merging PR #${pullNumber}: ${error.message}`);
                return;
              }
              throw error;
            }

            core.info(`Squash-merged PR #${pullNumber} at ${headSha}.`);
