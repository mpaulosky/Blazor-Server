---
name: Sandcastle

# Runs the Sandcastle host (.sandcastle/main.mts) unattended: it works the
# issues labelled Sandcastle and follows up on its own PRs. The design is in
# docs/plans/sandcastle-workflow.md ("Trigger and run environment") and
# docs/adr/0002-unattended-sandcastle-on-a-hosted-runner.md.
#
# Every trigger runs the host code checked out from main, never the event's
# ref. Events can't filter by label name, branch or reviewer, so the job's if:
# does, and anything else ends as a skipped job. The concurrency group is on
# the job, not the workflow, so a skipped event never takes the pending slot.
#
# GITHUB_TOKEN is read-only. Every write goes through SANDCASTLE_GH_TOKEN, the
# owner's PAT, whose pushes start CI. It has no Workflows permission, so
# Sandcastle can't change this file.
"on":  # zizmor: ignore[dangerous-triggers] workflow_run runs this file as it is on main, and the job checks out main, never PR code.
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [unlabeled]
  pull_request_review:
    types: [submitted]
  # The name: of ci.yml: workflow_run matches workflow names, not file names.
  workflow_run:
    workflows: ["Build and Test Suite"]
    types: [completed]
  workflow_dispatch:
  # A backstop for blockers cleared by merges and PRs that fell behind main.
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  sandcastle:
    name: Sandcastle
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: sandcastle
      cancel-in-progress: false
    # Label events start a run only when the owner adds Sandcastle or removes a
    # hand-back label, so the labels the host applies itself (sandcastle:ready,
    # bug) end here. A review or CI run counts only for a same-repo issue
    # branch, so a fork never runs with the secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule'
      || (github.event_name == 'issues' && github.event.action == 'labeled'
        && github.event.label.name == 'Sandcastle'
        && github.event.sender.login == github.repository_owner)
      || ((github.event_name == 'issues' || github.event_name == 'pull_request') && github.event.action == 'unlabeled'
        && (github.event.label.name == 'sandcastle:needs-info' || github.event.label.name == 'sandcastle:needs-human')
        && github.event.sender.login == github.repository_owner)
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (startsWith(github.event.pull_request.head.ref, 'feature/')
          || startsWith(github.event.pull_request.head.ref, 'fix/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/')))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && (startsWith(github.event.workflow_run.head_branch, 'feature/')
          || startsWith(github.event.workflow_run.head_branch, 'fix/')
          || startsWith(github.event.workflow_run.head_branch, 'hotfix/')))

    steps:
      - name: Check the secrets
        env:
          SANDCASTLE_GH_TOKEN: ${{ secrets.SANDCASTLE_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          missing=0
          if [ -z "$SANDCASTLE_GH_TOKEN" ]; then
            echo "::error::The SANDCASTLE_GH_TOKEN secret isn't set. Add a fine-grained PAT for this repository (see docs/plans/sandcastle-workflow.md, Secrets)."
            missing=1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set. Add the output of claude setup-token as CLAUDE_CODE_OAUTH_TOKEN."
            missing=1
          fi
          exit "$missing"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # lib/skills.mts mounts the dotnet-* skills into the sandbox from
      # ~/.claude/skills, which a hosted runner doesn't have. They live in the
      # owner's public dotfiles repository. This runs before the credential
      # helper is set up, so the clone never sends the PAT.
      - name: Install the dotnet skills
        run: |
          dotfiles="$RUNNER_TEMP/dotfiles"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/mpaulosky/dotfiles.git "$dotfiles"
          git -C "$dotfiles" sparse-checkout set "Support For New Projects/.claude/skills"
          echo "dotfiles at $(git -C "$dotfiles" rev-parse HEAD)"
          mkdir -p "$HOME/.claude"
          ln -s "$dotfiles/Support For New Projects/.claude/skills" "$HOME/.claude/skills"
          ls "$HOME/.claude/skills/"

      # The host's git fetches and pushes authenticate through gh's credential
      # helper in the runner's global config, which reads GH_TOKEN from the
      # host's environment, so the repository's .git holds no token. Sandcastle
      # gives the sandbox the host's git identity for its commits, so set the
      # PAT owner's.
      - name: Set up git for the PAT
        env:
          GH_TOKEN: ${{ secrets.SANDCASTLE_GH_TOKEN }}
        run: |
          gh auth setup-git
          login="$(gh api user --jq .login)"
          id="$(gh api user --jq .id)"
          git config --global user.name "$login"
          git config --global user.email "${id}+${login}@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sandcastle passes into the sandbox only the keys .sandcastle/.env
      # names, taking a blank one's value from the host's environment. The file
      # is git-ignored, so it's written here with the key and no value: the
      # secret stays in the environment. Never GH_TOKEN, which the host refuses.
      - name: Run Sandcastle
        env:
          GH_TOKEN: ${{ secrets.SANDCASTLE_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            unset CLAUDE_CODE_OAUTH_TOKEN
            echo "ANTHROPIC_API_KEY=" > .sandcastle/.env
          else
            unset ANTHROPIC_API_KEY
            echo "CLAUDE_CODE_OAUTH_TOKEN=" > .sandcastle/.env
          fi
          pnpm run sandcastle

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandcastle-logs
          path: .sandcastle/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # GitHub doesn't notify the owner about the PAT's own labels and
      # comments, so a run that handed anything back ends red: Actions emails
      # the person the run is attributed to.
      - name: Fail on hand-backs
        run: |
          handbacks=.sandcastle/logs/handbacks.json
          if [ ! -f "$handbacks" ]; then
            echo "::error::$handbacks is missing, so this run's hand-backs are unknown."
            exit 1
          fi
          count="$(jq length "$handbacks")"
          if [ "$count" -gt 0 ]; then
            echo "::error::This run handed back $count issue(s) or PR(s) to a human. See the job summary."
            jq -r '.[] | "\(.kind) #\(.number): \(.label) \(.url)"' "$handbacks"
            exit 1
          fi
