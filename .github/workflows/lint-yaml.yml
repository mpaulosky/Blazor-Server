---
name: Lint YAML
# Validates all workflow and config YAML files

"on":
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml
