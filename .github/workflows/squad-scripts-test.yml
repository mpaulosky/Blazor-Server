---
name: Squad Scripts Test
# Runs the shell tests for the squad scripts (branch/worktree cleanup).

"on":
  pull_request:
    branches:
      - "main"
    paths:
      - "scripts/squad/**"
      - ".github/workflows/squad-scripts-test.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  test:
    name: Test squad scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cleanup-squad-branches tests
        run: bash scripts/squad/tests/cleanup-squad-branches.test.sh
