---
name: ".NET code metrics"

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "CODE_METRICS.md"

  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "CODE_METRICS.md"

  workflow_dispatch:
    inputs:
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual run"

# Read-only on purpose: pull_request runs execute the unpinned metrics action
# and must not get a write-capable token. The main-only PR step below pushes
# and opens the PR with RELEASE_PR_PAT instead.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] create-pull-request pushes with the checkout's credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: "Print manual run reason"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # Free text from the dispatcher: read from env, never interpolated.
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          echo "Reason: $REASON"
      - name: .NET code metrics
        id: dotnet-code-metrics
        uses: dotnet/samples/github-actions/DotNet.GitHubAction@acb39ceb13f910ae0f8f6298059c59102b749c41  # main as of 2026-09-26
        env:
          GREETINGS: "Hello, .NET developers!"  # ${{ secrets.GITHUB_TOKEN }}
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ github.repository }}
          branch: ${{ github.ref }}
          dir: ${{ './' }}

      # Only open a metrics PR from main. Pull request runs check out a detached
      # merge commit (refs/pull/N/merge), which create-pull-request can't use as a
      # base, and a manual run from another branch must not publish metrics either.
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        if: ${{ github.ref == 'refs/heads/main' && steps.dotnet-code-metrics.outputs.updated-metrics == 'true' }}
        with:
          title: "${{ steps.dotnet-code-metrics.outputs.summary-title }}"
          body: "${{ steps.dotnet-code-metrics.outputs.summary-details }}"
          commit-message: ".NET code metrics, automated pull request."
          branch: chore/code-metrics
          # A PAT, not GITHUB_TOKEN: the workflow token is read-only, Actions
          # may not create PRs in this repository, and a PR opened with
          # GITHUB_TOKEN wouldn't trigger the checks main requires.
          token: ${{ secrets.RELEASE_PR_PAT }}
