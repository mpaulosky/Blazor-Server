---
name: ".NET code metrics"

"on":
  push:
    branches:
      - main
    paths-ignore:
      - "CODE_METRICS.md"

  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "CODE_METRICS.md"

  workflow_dispatch:
    inputs:
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual run"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: "Print manual run reason"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Reason: ${{ github.event.inputs.reason }}'
      - name: .NET code metrics
        id: dotnet-code-metrics
        uses: dotnet/samples/github-actions/DotNet.GitHubAction@main
        env:
          GREETINGS: "Hello, .NET developers!"  # ${{ secrets.GITHUB_TOKEN }}
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ github.repository }}
          branch: ${{ github.ref }}
          dir: ${{ './' }}

      # Only open a metrics PR from main. On pull_request events the checkout is a
      # detached merge commit, which create-pull-request can't use as a base.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        if: ${{ github.event_name != 'pull_request' && steps.dotnet-code-metrics.outputs.updated-metrics == 'true' }}
        with:
          title: "${{ steps.dotnet-code-metrics.outputs.summary-title }}"
          body: "${{ steps.dotnet-code-metrics.outputs.summary-details }}"
          commit-message: ".NET code metrics, automated pull request."
